  setSt(ok?'Synced ✓':'Not synced – busy, will retry')}

function editCal(){const p=P(ui.pid),c=S.att[p.id]||{};ui.cal=true;ui.draft={pid:p.id,att:Object.assign({},c),base:Object.assign({},c)};draw()}

 new Set([...Object.keys(d.att),...Object.keys(d.base)]).forEach(k=>{if(d.att[k]!==d.base[k]){n++;if(d.att[k])a[k]=d.att[k];else delete a[k];stamp(S.at,d.pid,k)}});

 else if(t=='ledger'){T=`Payment ledger – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','For month','Note','Amount'];const L=S.pay.filter(x=>(ui.rp=='all'||x.pid==ui.rp)&&x.date.slice(0,4)==Y).sort((a,b)=>a.date.localeCompare(b.date));rows=L.map(x=>[fd(x.date),P(x.pid)?.name||'(removed)',x.mon,x.note,money(x.amt)]);tot=['Total','','','',money(L.reduce((s,x)=>s+ +x.amt,0))]}
 else if(t=='notes'){T=`Attendance notes – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','Status','Note'];rows=[];pp.forEach(p=>Object.entries(S.nt[p.id]||{}).forEach(([d,x])=>{if(x&&d.slice(0,4)==Y)rows.push([d,p.name,({P:'Present',A:'Absent',H:'Half day'})[(S.att[p.id]||{})[d]]||(H[d]?'Holiday':'Not marked'),x])}));rows.sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));rows.forEach(r=>r[0]=fd(r[0]));tot=null}
 else{const p=pp[0];T=`Attendance register – ${p.name} – ${Y}`;hd=['Month',...Array.from({length:31},(_,i)=>i+1)];const a=S.att[p.id]||{};rows=MN.map((n,i)=>[n,...Array.from({length:31},(_,d)=>{if(d+1>dim(Y,i+1))return'';const k=key(Y,i+1,d+1),v=a[k];return v=='P'?'P':v=='A'?'A':v=='H'?'½':H[k]?'H':'–'})]);tot=null}
 RD={T,hd,rows,tot};
 el.innerHTML=`<div class="rh">${S.logo?`<img src="${S.logo}" alt="">`:''}<b>${esc(S.label)}</b></div><h2>${esc(T)}</h2><div class="tw"><table><tr>${hd.map((h,i)=>`<th class="${i>=hd.length-3&&t!='reg'&&t!='notes'?'n':''}">${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>=hd.length-3&&t!='reg'&&t!='notes'?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="t">${tot.map((c,i)=>`<td class="${i>=hd.length-3?'n':''}">${esc(c)}</td>`).join('')}</tr>`:''}</table></div>
 ${t=='reg'?'<p class="mut">P present, A absent, ½ half day, H holiday, – not marked.</p>':''}<div class="row noprint" style="margin-top:12px"><button class="b" onclick="window.print()">Print or save as PDF</button><button class="b g" onclick="csv()">Show as CSV</button></div><div id="tx" class="noprint"></div>`}
function csv(){const q=c=>'"'+String(c).replace(/"/g,'""')+'"',a=[RD.T,RD.hd,...RD.rows];if(RD.tot)a.push(RD.tot);txt('Copy this text and paste it into Excel or Google Sheets.',a.map(r=>[].concat(r).map(q).join(',')).join('\n'))}
look();draw();if(on()){setSt('Connecting…');pull();setInterval(pull,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}else setSt('This device only');
