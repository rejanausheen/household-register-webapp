<script>
const K='helpbook-v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),

const now=new Date(),ui={tab:'att',pid:'',mon:now.getFullYear()+'-'+pad(now.getMonth()+1),ry:now.getFullYear(),rt:'month',rp:'all',edit:null};
const LK=K+'-look',PRE=['#0e7c66','#1d4ed8','#6d28d9','#be185d','#c2410c','#0f766e','#334155','#b91c1c','#a16207'];

const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)},

function look(){const r=document.documentElement,L=LOOK,st=r.style;if(L.th=='auto')r.removeAttribute('data-theme');else r.dataset.theme=L.th;
 const dark=L.th=='dark'||(L.th=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
 if(L.acc){let a=L.acc;if(dark&&lum(a)<.12)a=mix(a,255,.35);st.setProperty('--pri',a);st.setProperty('--pri2',mix(a,0,.22));st.setProperty('--pg',dark?mix(L.acc,255,.45):a);st.setProperty('--on',lum(a)>.45?'#111':'#fff')}
 else['--pri','--pri2','--pg','--on'].forEach(v=>st.removeProperty(v));
 document.body.style.fontSize=(L.fs||15)+'px'}
function savLook(){try{localStorage.setItem(LK,JSON.stringify(LOOK))}catch(e){}look()}
function setTheme(v){LOOK.th=v;savLook()}
function setFs(v){LOOK.fs=+v;savLook()}
function setAcc(c){LOOK.acc=c;savLook();draw()}

try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',look)}catch(e){}
const FZ=(()=>{try{return JSON.parse(localStorage.getItem(K+'-fold')||'{}')}catch(e){return{}}})();
const fo=(id,d)=>((FZ[id]===undefined?d:FZ[id])?'open ':'')+`ontoggle="fz('${id}',this.open)"`;
function fz(id,v){if(FZ[id]===v)return;FZ[id]=v;try{localStorage.setItem(K+'-fold',JSON.stringify(FZ))}catch(e){}}
let CFG={};try{CFG=JSON.parse(localStorage.getItem(K+'-cfg')||'{}')}catch(e){}
let RTS=0,pushT,busy=false,dirty=false;

async function api(action,x){const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.key,action},x))}),j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j}
function keep(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save: browser storage is full or blocked.')}}
function save(){S.ts=Date.now();keep();if(on()){setSt('Saving…');clearTimeout(pushT);pushT=setTimeout(push,900)}}
const canon=x=>JSON.stringify(x,(k,v)=>k==='ts'?undefined:(v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(z=>[z,v[z]])):v));

async function push(){if(busy){dirty=true;return}busy=true;let ok=0;
 try{for(let i=0;i<4&&!ok;i++){const j=await api('set',{data:S,expect:RTS});if(!j.conflict){RTS=S.ts;ok=1;break}S=merge(S,j.result);S.ts=Date.now();keep();RTS=j.result.ts||0;rd()}
  setSt(ok?'Synced ✓':'Not synced – busy, will retry')}
 catch(e){setSt('Not synced – '+e.message)}busy=false;if(dirty){dirty=false;push()}}
async function pull(){if(!on()||busy)return;
 try{const r=(await api('get')).result||{};
  if(!r.ts){RTS=0;if(!S.ts)S.ts=Date.now();await push();return}
  if(r.ts===RTS){setSt(S.ts===RTS?'Synced ✓':'Saving…');return}
  const m=merge(S,r),ch=canon(m)!==canon(S),up=canon(m)!==canon(r);RTS=r.ts;S=m;
  if(ch){keep();rd()}
  if(up){S.ts=Date.now();keep();await push()}else setSt('Synced ✓')}
 catch(e){setSt('Not synced – '+e.message)}}
async function syncNow(){if(!on()){toast('Sync is not set up yet. Enter your address and key here.');go('set');return}
 const b=$('#sb');b.disabled=true;b.textContent='Syncing…';setSt('Syncing…');clearTimeout(pushT);
 try{for(let i=0;i<50&&busy;i++)await new Promise(r=>setTimeout(r,100));if(S.ts!==RTS)await push();await pull()}catch(e){setSt('Not synced – '+e.message)}
 for(let i=0;i<50&&busy;i++)await new Promise(r=>setTimeout(r,100));
 b.disabled=false;b.textContent='Sync';toast($('#sy').textContent.indexOf('Synced')==0?'Synced with your other devices':$('#sy').textContent)}
async function exitApp(){if(ui.cal&&calDirty()&&!confirm('You have unsaved attendance changes. Exit without saving them?'))return;clearTimeout(pushT);keep();if(on()){for(let i=0;i<50&&busy;i++)await new Promise(r=>setTimeout(r,100));await push();for(let i=0;i<50&&busy;i++)await new Promise(r=>setTimeout(r,100))}
 const ok=!on()||$('#sy').textContent.indexOf('Synced')==0;CFG={};
 document.body.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#f3f6f4;color:#16302b;font:16px 'Trebuchet MS',Verdana,sans-serif"><h2 style="font-family:Georgia,serif;margin:0">${ok?'Saved. You can close this window.':'Saved on this device.'}</h2><p style="margin:0;max-width:340px">${ok?'Your register is up to date on all devices.':'Syncing did not finish. It will sync the next time you open the app online.'}</p><button onclick="location.reload()" style="padding:12px 20px;border:0;border-radius:10px;background:#0e7c66;color:#fff;font:600 15px Verdana,sans-serif">Open again</button></div>`;
 try{window.close()}catch(e){}}
function saveSync(){const u=$('#su').value.trim(),k=$('#sk').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)||!k)return toast('Paste the Web app address (it starts with https://script.google.com) and your secret key.');CFG={url:u,key:k};try{localStorage.setItem(K+'-cfg',JSON.stringify(CFG))}catch(e){}setSt('Connecting…');pull();toast('Sync settings saved')}
function stopSync(){CFG={};try{localStorage.removeItem(K+'-cfg')}catch(e){}setSt('This device only');draw()}
function merge(a,b){const D=Object.assign({},b.del,a.del),o=Object.assign(DEF(),b);o.del=D;
 const pick=(x,y,k,pre)=>{const m=new Map();(y||[]).forEach(i=>m.set(i[k],i));(x||[]).forEach(i=>{const j=m.get(i[k]);if(!j||(i.t||0)>=(j.t||0))m.set(i[k],i)});return[...m.values()].filter(i=>!D[pre+i[k]]&&!(i.pid&&D['p:'+i.pid])).sort((p,q)=>String(p[k]).localeCompare(String(q[k])))};
 o.people=pick(a.people,b.people,'id','p:');o.pay=pick(a.pay,b.pay,'id','y:');o.extra=pick(a.extra,b.extra,'id','x:');o.hol=pick(a.hol,b.hol,'date','h:');o.pl=pick(a.pl,b.pl,'id','l:');o.jr=pick(a.jr,b.jr,'id','j:');o.cj=pick(a.cj,b.cj,'id','c:');o.cp=pick(a.cp,b.cp,'id','q:');
 const live=new Set(o.people.map(p=>p.id)),u=(...z)=>[...new Set(z.flatMap(q=>Object.keys(q||{})))];
 const cm=(ma,ta,mb,tb)=>{const m={},t={};u(ma,ta,mb,tb).forEach(pid=>{if(!live.has(pid))return;m[pid]={};t[pid]={};const A=(ma||{})[pid]||{},B=(mb||{})[pid]||{},TA=(ta||{})[pid]||{},TB=(tb||{})[pid]||{};u(A,B,TA,TB).forEach(d=>{const x=TA[d]||0,y=TB[d]||0,v=x>y?A[d]:y>x?B[d]:(A[d]!==undefined?A[d]:B[d]);if(v!==undefined)m[pid][d]=v;if(x||y)t[pid][d]=Math.max(x,y)})});return[m,t]};
 [o.att,o.at]=cm(a.att,a.at,b.att,b.at);[o.nt,o.nat]=cm(a.nt,a.nat,b.nt,b.nat);
 if((a.lbt||0)>(b.lbt||0)){o.label=a.label;o.logo=a.logo;o.lbt=a.lbt}else if(!b.logo&&a.logo&&!b.lbt)o.logo=a.logo;

 dashT=setInterval(()=>{if(PF.clock)tick();if(PF.wx&&new Date().getSeconds()==0)wxDraw()},1000)}

// ===== confetti on special days =====
function confetti(force){if(!force&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';document.body.appendChild(cv);
 const dpr=window.devicePixelRatio||1,W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,x=cv.getContext('2d'),cols=['#f94144','#f3722c','#f9c74f','#90be6d','#43aa8b','#577590','#c77dff','#ff70a6'];
 const P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.6,w:(6+Math.random()*8)*dpr,h:(4+Math.random()*6)*dpr,vx:(Math.random()-.5)*3*dpr,vy:(2+Math.random()*4)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
 const t0=performance.now();(function f(t){const el=t-t0;x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx+Math.sin(p.y/80)*dpr;p.y+=p.vy;p.vy+=.03*dpr;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-Math.max(0,el-4000)/1500);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(el<5500)requestAnimationFrame(f);else cv.remove()})(t0)}
function specialToday(){const t=tdy(),o=[];if(PF.cfd)(S.pl||[]).forEach(it=>{if(!ptype(it).k&&occ(it,t,t).length)o.push(it.title)});if(PF.cfh)(S.hol||[]).forEach(h=>{if(h.date==t&&h.name!='Sunday')o.push(h.name)});return o}
function maybeConfetti(){const t=tdy();if(PF.cf&&specialToday().length&&PF.cfLast!=t){PF.cfLast=t;savePF();setTimeout(()=>confetti(),600)}}
function spDraw(){const e=$('#sp');if(!e)return;const sd=specialToday();e.innerHTML=sd.length?`<div class="spb">🎉 Today: ${sd.map(esc).join(' · ')}</div>`:''}

// ===== app lock (PIN + fingerprint / face through the phone's own security) =====
let tries=0,until=0,pin='',hiddenAt=0;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hp(p,salt){const b=new TextEncoder().encode(salt+':'+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(salt+':'+p)}
function showLock(){if(!lockOn())return;let o=$('#lk');if(!o){o=document.createElement('div');o.id='lk';document.body.appendChild(o)}pin='';lkDraw();o.style.display='flex';if(LKS.bio)setTimeout(bioUnlock,300)}
function lkDraw(msg){const o=$('#lk'),n=LKS.n||4;o.innerHTML=`<div class="lkb"><div class="lkl">🔒</div><h2>${esc(S.label)}</h2><p class="mut">${msg||'Enter your PIN to open'}</p><div class="dots">${Array.from({length:n},(_,i)=>`<i class="${i<pin.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="kp('${d}')">${d}</button>`).join('')}${LKS.bio?'<button onclick="bioUnlock()" aria-label="Use fingerprint">🖐️</button>':'<span></span>'}<button onclick="kp('0')">0</button><button onclick="kp('b')" aria-label="Delete">⌫</button></div><button class="lkf" onclick="forgotPin()">Forgot PIN?</button></div>`}
async function kp(d){if(Date.now()<until)return lkDraw('Too many tries. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.');const n=LKS.n||4;if(d=='b')pin=pin.slice(0,-1);else if(pin.length<n)pin+=d;lkDraw();
 if(pin.length==n){const ok=(await hp(pin,LKS.salt))==LKS.hash;if(ok){tries=0;unlock()}else{tries++;pin='';if(tries>=5){until=Date.now()+30000;tries=0;lkDraw('Too many tries. Wait 30 seconds.')}else lkDraw('Wrong PIN. Try again.');if(navigator.vibrate)navigator.vibrate(200)}}}
function unlock(){const o=$('#lk');if(o)o.style.display='none';pin='';maybeConfetti()}
function forgotPin(){if(!confirm('A forgotten PIN cannot be recovered.\n\nTo get back in, this device’s saved copy of your register will be erased. If sync was set up, your data stays safe in your Google Drive and comes back when you enter your sync address and secret key again. If sync was NOT set up, the data on this device will be lost.\n\nErase this device’s data and remove the lock?'))return;try{Object.keys(localStorage).filter(k=>k.indexOf(K)==0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
async function setPin(){const a=$('#lp1').value.trim(),b=$('#lp2').value.trim();if(!/^\d{4,6}$/.test(a))return toast('The PIN must be 4 to 6 digits.');if(a!=b)return toast('The two PINs do not match.');
 if(lockOn()&&(await hp($('#lp0').value.trim(),LKS.salt))!=LKS.hash)return toast('The current PIN is not correct.');
 const salt=b64(crypto.getRandomValues(new Uint8Array(12)));LKS=Object.assign({},LKS,{salt,n:a.length,hash:await hp(a,salt),after:LKS.after??60});saveLock();lkBtn();toast('App lock is on');draw()}
async function removePin(){if((await hp(($('#lp0')||{}).value||'',LKS.salt))!=LKS.hash)return toast('Enter your current PIN to turn the lock off.');LKS={};saveLock();lkBtn();toast('App lock is off');draw()}
function setAfter(v){LKS.after=+v;saveLock()}
function lkBtn(){const b=$('#lkb');if(b)b.hidden=!lockOn()}
async function bioReg(){try{if(!window.PublicKeyCredential)throw 0;const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:S.label||'Register',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner',displayName:'Owner'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});LKS.bio=b64(c.rawId);saveLock();toast('Fingerprint unlock is on');draw()}catch(e){toast('Fingerprint unlock is not available here, or it was cancelled.')}}
async function bioUnlock(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:ub(LKS.bio),transports:['internal']}],userVerification:'required',timeout:60000}});unlock()}catch(e){}}
function bioOff(){delete LKS.bio;saveLock();draw()}
document.addEventListener('keydown',e=>{const o=$('#lk');if(!o||o.style.display=='none')return;if(/^\d$/.test(e.key))kp(e.key);else if(e.key=='Backspace')kp('b')});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(lockOn()&&LKS.after>=0&&hiddenAt&&Date.now()-hiddenAt>=LKS.after*1000)showLock();wxFetch();wxDraw();spDraw()});
function boot2(){lkBtn();dashInit();if(lockOn())showLock();else maybeConfetti();setInterval(()=>wxFetch(),9e5)}
function stamp(m,pid,k){(m[pid]=m[pid]||{})[k]=Date.now()}
const calDirty=()=>{const d=ui.draft;return !!d&&[...new Set([...Object.keys(d.att),...Object.keys(d.base)])].some(k=>d.att[k]!==d.base[k])};
function lose(){if(ui.cal&&calDirty()&&!confirm('Discard your unsaved attendance changes?'))return false;ui.cal=false;ui.draft=null;return true}
function editCal(){const p=P(ui.pid),c=S.att[p.id]||{};ui.cal=true;ui.draft={pid:p.id,att:Object.assign({},c),base:Object.assign({},c)};draw()}
function cancelCal(){if(!lose())return;draw()}
function saveCal(){const d=ui.draft;if(!d)return;const a=S.att[d.pid]=S.att[d.pid]||{};let n=0;
 new Set([...Object.keys(d.att),...Object.keys(d.base)]).forEach(k=>{if(d.att[k]!==d.base[k]){n++;if(d.att[k])a[k]=d.att[k];else delete a[k];stamp(S.at,d.pid,k)}});
 ui.cal=false;ui.draft=null;if(n)save();toast(n?'Attendance saved':'No changes to save');draw()}
function chgMon(i){if(!lose()){draw();return}ui.mon=i.value||ui.mon;draw()}
function chgP(i){if(!lose()){draw();return}ui.pid=i.value;draw()}
function tog(k){if(!ui.cal||!ui.draft){toast('Calendar is locked. Press “Edit attendance” to change it.');return}const a=ui.draft.att,n={'':'P',P:'A',A:'H',H:''}[a[k]||''];if(n)a[k]=n;else delete a[k];draw()}
function allP(){if(!ui.draft)return;const [y,m]=ui.mon.split('-').map(Number),H=hm(),a=ui.draft.att;for(let d=1;d<=dim(y,m);d++){const k=key(y,m,d);if(!H[k]&&!a[k])a[k]='P'}draw()}
function clr(){if(!ui.draft||!confirm('Clear all attendance marks for this person in this month? (Press Save to keep the change.)'))return;const a=ui.draft.att;Object.keys(a).forEach(k=>{if(k.slice(0,7)==ui.mon)delete a[k]});draw()}
function saveNote(){const p=P(ui.pid),d=$('#nd').value,t=$('#nn').value.trim();if(!d)return toast('Choose a day.');const m=S.nt[p.id]=S.nt[p.id]||{};if(t)m[d]=t;else delete m[d];stamp(S.nat,p.id,d);save();toast(t?'Note saved':'Note removed');draw()}
function editNote(d){$('#nd').value=d;$('#nn').value=S.nt[ui.pid][d];$('#nn').focus()}
function delNote(d){delete S.nt[ui.pid][d];stamp(S.nat,ui.pid,d);save();draw()}
function addExtra(){const p=P(ui.pid),a=+$('#xa').value,d=$('#xd').value;if(!a||a<=0||!d)return toast('Choose a day and enter an amount above zero.');const x={id:uid(),pid:p.id,date:d,amt:a,note:$('#xn').value.trim()||'Extra work'};
 if($('#xp').checked){const q={id:uid(),pid:p.id,date:d,mon:d.slice(0,7),amt:a,note:'Extra work: '+x.note};S.pay.push(q);x.payId=q.id}
 (S.extra=S.extra||[]).push(x);save();toast('Extra work added');draw()}
function delExtra(id){if(!confirm('Delete this extra work entry (and its linked payment, if any)?'))return;const x=S.extra.find(z=>z.id==id);if(x&&x.payId){S.del['y:'+x.payId]=Date.now();S.pay=S.pay.filter(q=>q.id!=x.payId)}S.del['x:'+id]=Date.now();S.extra=S.extra.filter(z=>z.id!=id);save();draw()}
function addPay(){const a=+$('#pa').value,d=$('#pd').value,m=$('#pm').value,pid=$('#pp').value;if(!a||a<=0||!d||!m)return toast('Enter the date, month and an amount above zero.');S.pay.push({id:uid(),pid,date:d,mon:m,amt:a,note:$('#pn').value.trim()});save();toast('Payment saved');draw()}
function delPay(id){if(confirm('Delete this payment?')){S.del['y:'+id]=Date.now();S.pay=S.pay.filter(x=>x.id!=id);save();draw()}}
function savePerson(){const n=$('#fn').value.trim(),r=$('#fr').value.trim();if(!n||!r)return toast('Enter a name and a role.');const o={name:n,role:r,basis:$('#fb').value,rate:+$('#fa').value||0,phone:$('#fp').value.trim(),payHol:$('#fh').checked,t:Date.now()};
 if(ui.edit)Object.assign(P(ui.edit),o);else{const p=Object.assign({id:uid()},o);S.people.push(p);ui.pid=p.id}save();ui.edit=null;toast('Saved');draw()}
function delPerson(id){if(!confirm('Remove this person and all their attendance and payment records?'))return;S.del['p:'+id]=Date.now();S.people=S.people.filter(p=>p.id!=id);delete S.att[id];delete S.nt[id];S.extra=(S.extra||[]).filter(x=>x.pid!=id);S.pay=S.pay.filter(x=>x.pid!=id);save();draw()}
function addHol(){const d=$('#hd').value,n=$('#hn2').value.trim();if(!d||!n)return toast('Enter a date and a name.');delete S.del['h:'+d];S.hol=S.hol.filter(h=>h.date!=d);S.hol.push({date:d,name:n});save();draw()}
function delHol(d){S.del['h:'+d]=Date.now();S.hol=S.hol.filter(h=>h.date!=d);save();draw()}
function sundays(){const y=ui.ry;for(let m=1;m<=12;m++)for(let d=1;d<=dim(y,m);d++)if(new Date(y,m-1,d).getDay()==0){const k=key(y,m,d);if(!S.hol.some(h=>h.date==k)){delete S.del['h:'+k];S.hol.push({date:k,name:'Sunday'})}}save();draw()}
function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');S.lbt=Date.now();save();draw()};im.onerror=()=>toast('That file is not a usable image.');im.src=r.result};r.readAsDataURL(f)}
function txt(t,v,ta){$('#tx').innerHTML=`<p class="mut">${t}</p><textarea id="tb" rows="6" ${ta?'':'readonly'}>${esc(v)}</textarea><div class="row" style="margin-top:8px"><button class="b s" onclick="$('#tb').select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it')}">Copy</button></div>`;$('#tb').select()}
function restore(){$('#tx').innerHTML=`<p class="mut">Paste backup text, then press Restore. This replaces the current data.</p><textarea id="tb" rows="6"></textarea><div class="row" style="margin-top:8px"><button class="b s" onclick="doRestore()">Restore</button></div>`}
function doRestore(){try{const x=JSON.parse($('#tb').value);if(!Array.isArray(x.people))throw 0;S=Object.assign(DEF(),x);save();toast('Restored');draw()}catch(e){toast('That text is not a valid backup.')}}
let RD=null;
function rep(){const el=$('#rep');if(!el)return;const[y,m]=ym(ui.mon),t=ui.rt,pp=ui.rp=='all'?S.people:S.people.filter(p=>p.id==ui.rp),Y=ui.ry,H=hm();let T,hd,rows,tot;
 if(!S.people.length){el.innerHTML='<p class="empty">Add people first.</p>';return}
 if(t=='month'){T=`Monthly statement – ${MN[m-1]} ${y}`;hd=['Name','Role','Present','Half','Absent','Holidays','Extra work','Earned','Paid','Balance'];let e=0,pd=0,xt=0;rows=pp.map(p=>{const s=stats(p,y,m);e+=s.earned;pd+=s.paid;xt+=s.ex;return[p.name,p.role,s.pr,s.hf,s.ab,s.hl,money(s.ex),money(s.earned),money(s.paid),money(s.earned-s.paid)]});tot=['Total','','','','','',money(xt),money(e),money(pd),money(e-pd)]}
 else if(t=='year'&&ui.rp!='all'){const p=pp[0];T=`Yearly summary – ${p.name} – ${Y}`;hd=['Month','Present','Half','Absent','Holidays','Extra work','Earned','Paid','Balance','Due so far'];let e=0,pd=0,xt=0;rows=MN.map((n,i)=>{const s=stats(p,Y,i+1);e+=s.earned;pd+=s.paid;xt+=s.ex;return[n,s.pr,s.hf,s.ab,s.hl,money(s.ex),money(s.earned),money(s.paid),money(s.earned-s.paid),money(e-pd)]});tot=['Total','','','','',money(xt),money(e),money(pd),'',money(e-pd)]}
 else if(t=='year'){T=`Yearly summary – everyone – ${Y}`;hd=['Name','Role','Days present','Days absent','Earned','Paid','Due'];let e=0,pd=0;rows=pp.map(p=>{let a=0,b=0,x=0,z=0;for(let i=1;i<=12;i++){const s=stats(p,Y,i);a+=s.pr+s.hf/2;b+=s.ab+s.hf/2;x+=s.earned;z+=s.paid}e+=x;pd+=z;return[p.name,p.role,a,b,money(x),money(z),money(x-z)]});tot=['Total','','','',money(e),money(pd),money(e-pd)]}
 else if(t=='ledger'){T=`Payment ledger – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','For month','Note','Amount'];const L=S.pay.filter(x=>(ui.rp=='all'||x.pid==ui.rp)&&x.date.slice(0,4)==Y).sort((a,b)=>a.date.localeCompare(b.date));rows=L.map(x=>[fd(x.date),P(x.pid)?.name||'(removed)',x.mon,x.note,money(x.amt)]);tot=['Total','','','',money(L.reduce((s,x)=>s+ +x.amt,0))]}
 else if(t=='jr'){T=`Journal – ${Y}`;hd=['Date','Category','What happened','Amount','Details'];const L=S.jr.filter(x=>x.date.slice(0,4)==Y).sort((a,b)=>a.date.localeCompare(b.date));rows=L.map(x=>[fd(x.date),x.cat,x.title,x.amt?money(x.amt):'',x.note||'']);const sm=L.reduce((s,x)=>s+(+x.amt||0),0);tot=sm?['Total','','',money(sm),'']:null}
 else if(t=='pl'){T=`Chores and events – ${MN[m-1]} ${y}`;hd=['Date','Type','Title','Status','Note'];rows=[];const f=key(y,m,1),e=key(y,m,dim(y,m));S.pl.forEach(it=>occ(it,f,e).forEach(d=>rows.push([d,ptype(it).n,it.title,ptype(it).k?((it.dn||{})[d]?'Done':'Pending'):'',it.note||''])));rows.sort((a,b)=>a[0].localeCompare(b[0])||a[2].localeCompare(b[2]));rows.forEach(r=>r[0]=fd(r[0]));tot=null}
 else if(t=='notes'){T=`Attendance notes – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','Status','Note'];rows=[];pp.forEach(p=>Object.entries(S.nt[p.id]||{}).forEach(([d,x])=>{if(x&&d.slice(0,4)==Y)rows.push([d,p.name,({P:'Present',A:'Absent',H:'Half day'})[(S.att[p.id]||{})[d]]||(H[d]?'Holiday':'Not marked'),x])}));rows.sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));rows.forEach(r=>r[0]=fd(r[0]));tot=null}
 else{const p=pp[0];T=`Attendance register – ${p.name} – ${Y}`;hd=['Month',...Array.from({length:31},(_,i)=>i+1)];const a=S.att[p.id]||{};rows=MN.map((n,i)=>[n,...Array.from({length:31},(_,d)=>{if(d+1>dim(Y,i+1))return'';const k=key(Y,i+1,d+1),v=a[k];return v=='P'?'P':v=='A'?'A':v=='H'?'½':H[k]?'H':'–'})]);tot=null}
 RD={T,hd,rows,tot};
 el.innerHTML=`<div class="rh">${S.logo?`<img src="${S.logo}" alt="">`:''}<b>${esc(S.label)}</b></div><h2>${esc(T)}</h2><div class="tw"><table><tr>${hd.map((h,i)=>`<th class="${i>=hd.length-3&&t!='reg'&&t!='notes'&&t!='pl'&&t!='jr'?'n':''}">${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>=hd.length-3&&t!='reg'&&t!='notes'&&t!='pl'&&t!='jr'?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="t">${tot.map((c,i)=>`<td class="${i>=hd.length-3?'n':''}">${esc(c)}</td>`).join('')}</tr>`:''}</table></div>
 ${t=='reg'?'<p class="mut">P present, A absent, ½ half day, H holiday, – not marked.</p>':''}<div class="row noprint" style="margin-top:12px"><button class="b" onclick="window.print()">Print or save as PDF</button><button class="b g" onclick="csv()">Show as CSV</button></div><div id="tx" class="noprint"></div>`}
function csv(){const q=c=>'"'+String(c).replace(/"/g,'""')+'"',a=[RD.T,RD.hd,...RD.rows];if(RD.tot)a.push(RD.tot);txt('Copy this text and paste it into Excel or Google Sheets.',a.map(r=>[].concat(r).map(q).join(',')).join('\n'))}
look();draw();boot2();if(on()){setSt('Connecting…');pull();setInterval(pull,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}else setSt('This device only');
