<script>
const K='helpbook-v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),

const DEF=()=>({label:'Household Help Register',logo:'',people:[],att:{},pay:[],hol:[],extra:[],pl:[],jr:[],cj:[],cp:[],ac:[],ec:[],tx:[],cfg:{},at:{},nt:{},nat:{},del:{},lbt:0});

const LK=K+'-look',PRE=['#0e7c66','#1d4ed8','#6d28d9','#be185d','#c2410c','#0f766e','#334155','#b91c1c','#a16207'];
let LOOK={th:'auto',acc:'',fs:15};try{Object.assign(LOOK,JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){}

 const dark=L.th=='dark'||(L.th=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
 if(L.acc){let a=L.acc;if(dark&&lum(a)<.12)a=mix(a,255,.35);st.setProperty('--pri',a);st.setProperty('--pri2',mix(a,0,.22));st.setProperty('--pg',dark?mix(L.acc,255,.45):a);st.setProperty('--on',lum(a)>.45?'#111':'#fff')}
 else['--pri','--pri2','--pg','--on'].forEach(v=>st.removeProperty(v));
 document.body.style.fontSize=(L.fs||15)+'px';if(window.btnVars)btnVars();const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=L.acc||'#0e7c66'}

const FZ=(()=>{try{return JSON.parse(localStorage.getItem(K+'-fold')||'{}')}catch(e){return{}}})();
const fo=(id,d)=>((FZ[id]===undefined?d:FZ[id])?'open ':'')+`ontoggle="fz('${id}',this.open)"`;

async function push(){if(busy){dirty=true;return}busy=true;let ok=0;
 try{for(let i=0;i<4&&!ok;i++){const j=await api('set',{data:S,expect:RTS});if(!j.conflict){RTS=S.ts;ok=1;break}S=merge(S,j.result);S.ts=Date.now();keep();RTS=j.result.ts||0;rd()}
  setSt(ok?'Synced ✓':'Not synced – busy, will retry')}

  if(r.ts===RTS){setSt(S.ts===RTS?'Synced ✓':'Saving…');return}

  if(ch){keep();rd()}

function occ(it,from,to){const out=[],r=it.rep||'none';
 if(r=='none'){if(it.date>=from&&it.date<=to)out.push(it.date);return out}
 if(it.date>to)return out;const s0=pd(it.date),f=pd(from>it.date?from:it.date),t=pd(to);
 for(const d=new Date(f);d<=t;d.setDate(d.getDate()+1)){let ok=false;
  if(r=='daily')ok=true;
  else if(r=='weekly')ok=d.getDay()==s0.getDay();
  else if(r=='monthly')ok=d.getDate()==Math.min(s0.getDate(),dim(d.getFullYear(),d.getMonth()+1));
  else if(r=='yearly'){const ly=new Date(d.getFullYear(),1,29).getMonth()==1;ok=(s0.getMonth()==1&&s0.getDate()==29&&!ly)?(d.getMonth()==1&&d.getDate()==28):(d.getMonth()==s0.getMonth()&&d.getDate()==s0.getDate())}
  if(ok)out.push(fmtD(d))}
 return out}

function rep(){const el=$('#rep');if(!el)return;const[y,m]=ym(ui.mon),t=ui.rt,pp=ui.rp=='all'?S.people:S.people.filter(p=>p.id==ui.rp),Y=ui.ry,H=hm();let T,hd,rows,tot;
 if(!S.people.length){el.innerHTML='<p class="empty">Add people first.</p>';return}
 if(t=='month'){T=`Monthly statement – ${MN[m-1]} ${y}`;hd=['Name','Role','Present','Half','Absent','Holidays','Extra work','Earned','Paid','Balance'];let e=0,pd=0,xt=0;rows=pp.map(p=>{const s=stats(p,y,m);e+=s.earned;pd+=s.paid;xt+=s.ex;return[p.name,p.role,s.pr,s.hf,s.ab,s.hl,money(s.ex),money(s.earned),money(s.paid),money(s.earned-s.paid)]});tot=['Total','','','','','',money(xt),money(e),money(pd),money(e-pd)]}
 else if(t=='year'&&ui.rp!='all'){const p=pp[0];T=`Yearly summary – ${p.name} – ${Y}`;hd=['Month','Present','Half','Absent','Holidays','Extra work','Earned','Paid','Balance','Due so far'];let e=0,pd=0,xt=0;rows=MN.map((n,i)=>{const s=stats(p,Y,i+1);e+=s.earned;pd+=s.paid;xt+=s.ex;return[n,s.pr,s.hf,s.ab,s.hl,money(s.ex),money(s.earned),money(s.paid),money(s.earned-s.paid),money(e-pd)]});tot=['Total','','','','',money(xt),money(e),money(pd),'',money(e-pd)]}
 else if(t=='year'){T=`Yearly summary – everyone – ${Y}`;hd=['Name','Role','Days present','Days absent','Earned','Paid','Due'];let e=0,pd=0;rows=pp.map(p=>{let a=0,b=0,x=0,z=0;for(let i=1;i<=12;i++){const s=stats(p,Y,i);a+=s.pr+s.hf/2;b+=s.ab+s.hf/2;x+=s.earned;z+=s.paid}e+=x;pd+=z;return[p.name,p.role,a,b,money(x),money(z),money(x-z)]});tot=['Total','','','',money(e),money(pd),money(e-pd)]}
 else if(t=='ledger'){T=`Payment ledger – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','For month','Note','Amount'];const L=S.pay.filter(x=>(ui.rp=='all'||x.pid==ui.rp)&&x.date.slice(0,4)==Y).sort((a,b)=>a.date.localeCompare(b.date));rows=L.map(x=>[fd(x.date),P(x.pid)?.name||'(removed)',x.mon,x.note,money(x.amt)]);tot=['Total','','','',money(L.reduce((s,x)=>s+ +x.amt,0))]}
 else if(t=='jr'){T=`Journal – ${Y}`;hd=['Date','Category','What happened','Amount','Details'];const L=S.jr.filter(x=>x.date.slice(0,4)==Y).sort((a,b)=>a.date.localeCompare(b.date));rows=L.map(x=>[fd(x.date),x.cat,x.title,x.amt?money(x.amt):'',x.note||'']);const sm=L.reduce((s,x)=>s+(+x.amt||0),0);tot=sm?['Total','','',money(sm),'']:null}
 else if(t=='pl'){T=`Chores and events – ${MN[m-1]} ${y}`;hd=['Date','Type','Title','Status','Note'];rows=[];const f=key(y,m,1),e=key(y,m,dim(y,m));S.pl.forEach(it=>occ(it,f,e).forEach(d=>rows.push([d,ptype(it).n,it.title,ptype(it).k?((it.dn||{})[d]?'Done':'Pending'):'',it.note||''])));rows.sort((a,b)=>a[0].localeCompare(b[0])||a[2].localeCompare(b[2]));rows.forEach(r=>r[0]=fd(r[0]));tot=null}
 else if(t=='notes'){T=`Attendance notes – ${ui.rp=='all'?'everyone':pp[0].name} – ${Y}`;hd=['Date','Person','Status','Note'];rows=[];pp.forEach(p=>Object.entries(S.nt[p.id]||{}).forEach(([d,x])=>{if(x&&d.slice(0,4)==Y)rows.push([d,p.name,({P:'Present',A:'Absent',H:'Half day'})[(S.att[p.id]||{})[d]]||(H[d]?'Holiday':'Not marked'),x])}));rows.sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));rows.forEach(r=>r[0]=fd(r[0]));tot=null}
 else{const p=pp[0];T=`Attendance register – ${p.name} – ${Y}`;hd=['Month',...Array.from({length:31},(_,i)=>i+1)];const a=S.att[p.id]||{};rows=MN.map((n,i)=>[n,...Array.from({length:31},(_,d)=>{if(d+1>dim(Y,i+1))return'';const k=key(Y,i+1,d+1),v=a[k];return v=='P'?'P':v=='A'?'A':v=='H'?'½':H[k]?'H':'–'})]);tot=null}
 RD={T,hd,rows,tot};
 el.innerHTML=`<div class="rh">${S.logo?`<img src="${S.logo}" alt="">`:''}<b>${esc(S.label)}</b></div><h2>${esc(T)}</h2><div class="tw"><table><tr>${hd.map((h,i)=>`<th class="${i>=hd.length-3&&t!='reg'&&t!='notes'&&t!='pl'&&t!='jr'?'n':''}">${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>=hd.length-3&&t!='reg'&&t!='notes'&&t!='pl'&&t!='jr'?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="t">${tot.map((c,i)=>`<td class="${i>=hd.length-3?'n':''}">${esc(c)}</td>`).join('')}</tr>`:''}</table></div>
 ${t=='reg'?'<p class="mut">P present, A absent, ½ half day, H holiday, – not marked.</p>':''}<div class="row noprint" style="margin-top:12px"><button class="b" onclick="window.print()">Print or save as PDF</button><button class="b g" onclick="csv()">Show as CSV</button></div><div id="tx" class="noprint"></div>`}
function csv(){const q=c=>'"'+String(c).replace(/"/g,'""')+'"',a=[RD.T,RD.hd,...RD.rows];if(RD.tot)a.push(RD.tot);txt('Copy this text and paste it into Excel or Google Sheets.',a.map(r=>[].concat(r).map(q).join(',')).join('\n'))}
look();draw();boot2();if(on()){setSt('Connecting…');pull();setInterval(pull,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}else setSt('This device only');
</script></body></html>
